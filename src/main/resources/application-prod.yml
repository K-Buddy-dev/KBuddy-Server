spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: prod
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:postgresql://${DB_SERVER_URL}:5432/kbuddy
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: true
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration: 3600      # 1 hour
      refresh-token-expiration: 604800   # 1 week
  jpa:
    show-sql: false  # Do not show SQL log in prod mode
    hibernate:
      ddl-auto: update  # Do not create DB instance in prod mode
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql.init.mode: never  # Do not initialize DB in prod mode
  data:
    redis:
      host: redis
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2
        debug: true

springdoc:
  api-docs:
    path: /api-docs # API 문서 생성 경로
    groups:
      enabled: true
  swagger-ui:
    path: /index.html # Swagger-ui 경로
    enabled: true
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  override-with-generic-response: false
  model-and-view-allowed: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

cloud:
  naver:
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
      endPoint: ${S3_ENDPOINT}
      accessKey: ${S3_ACCESS_KEY}
      secretKey: ${S3_SECRET_KEY}
management:
  endpoints:
    web:
      exposure:
        include: "*" # 모든 엔드포인트 노출 -> 추후 변경

firebase:
  type: ${FIREBASE_TYPE}
  project-id: ${FIREBASE_PROJECT_ID}
  private-key-id: ${FIREBASE_PRIVATE_KEY_ID}
  private-key: ${FIREBASE_PRIVATE_KEY}
  client-email: ${FIREBASE_CLIENT_EMAIL}
  client-id: ${FIREBASE_CLIENT_ID}
  auth-uri: ${FIREBASE_AUTH_URI}
  token-uri: ${FIREBASE_TOKEN_URI}
  auth-provider-x509-cert-url: ${FIREBASE_AUTH_PROVIDER_X509_CERT_URL}
  client-x509-cert-url: ${FIREBASE_CLIENT_X509_CERT_URL}
  universe-domain: ${FIREBASE_UNIVERSE_DOMAIN}